  role: approved_style_and_composition_reference

workflow:
  template: art-pipeline/comfyui/workflows/newtrip_pseudo3d_base_workflow.template.json
  current_policy: chatgpt_image_2_first
  comfyui_status: later_repeatable_factory_requires_local_model_paths
  required_controls:
    - style_reference_image
    - perspective_guide_for_road_layers
    - fixed_seed_per_asset

recommended_generation_settings:
  aspect_ratio: "9:16"
  draft_resolution: "1024x1792"
  final_source_resolution: "1536x2688"
  sampler: keep_fixed_per_batch
  steps: 28-40
  cfg: 5-8
  output_format: png

unity_target:
  platform: ios
  orientation: portrait
  texture_compression: ASTC
  atlas_policy: route_pack_sprite_atlas
  runtime_generation: false

