style_version: newtrip_pixel_pseudo3d_v1
reference_image: assets/art/reference/newtrip_style_reference_big_sur_pseudo3d_v1.png

style_lock: >-
  Premium 16-bit pixel art mobile road-trip game asset, crisp pixel shading,
  warm cinematic lighting, clean readable silhouettes, rich but controlled
  pixel detail, polished retro mobile game quality, no photorealism, no anime,
  no blurry edges, no messy low-resolution pixels.

camera_lock: >-
  Portrait 9:16 mobile composition, straight pseudo-3D forward-driving
  perspective, center vanishing point near upper-middle, camera slightly
  elevated behind the player vehicle position, road begins wide at the bottom
  edge and narrows toward the horizon, lower center reserved for a car sprite,
  top 14 percent calm enough for HUD overlay.

route_context: >-
  Big Sur California Highway 1 at sunset, ocean on the right, orange-brown
  rocky cliffs and evergreen pine trees on the left, layered purple mountains,
  metal guardrail, rocky coastline, deep blue ocean with pixelated waves and
  golden sunset reflections, distant arched coastal bridge near the right
  horizon, warm orange pink purple sky.

global_negative: >-
  curved road, side-scrolling view, HUD, UI, bottom buttons, car, extra cars,
  pedestrians, GPS navigation, racing interface, photorealistic render, anime,
  distorted perspective, unreadable sign text, watermark, logo, blurry image,
  noisy messy pixels.

layers:
  - asset_id: tutorial_coast_road_base_001
    layer_type: road_base
    seed: 18422017
    prompt: >-
      Generate only the gameplay road base layer. A long straight two-lane
      asphalt highway begins wide at the bottom foreground and stretches
      directly toward the center horizon vanishing point. Strong converging
      road edges, double yellow center lines, readable asphalt pixel texture,
      warm sunset shadows. Keep shoulders simple enough for separate roadside
      props. No car, no UI, no signs, no text.

  - asset_id: tutorial_coast_sky_far_001
    layer_type: sky_far
    seed: 18422018
    prompt: >-
      Generate only the far sky layer. Warm orange pink purple sunset gradient,
      pixelated clouds, large low sun near the right horizon, a few tiny birds,
      calm top area for HUD overlay. No road, no car, no UI, no text.

  - asset_id: tutorial_coast_far_landscape_001
    layer_type: far_landscape
    seed: 18422019
    prompt: >-
      Generate only the far landscape layer. Distant layered purple mountains,
      ocean horizon on the right, distant arched coastal bridge near the right
      horizon, atmospheric depth, warm sunset lighting. No road foreground,
      no car, no UI, no text.

  - asset_id: tutorial_coast_mid_landscape_001
    layer_type: mid_landscape
    seed: 18422020
    prompt: >-
      Generate only the middle landscape layer. Orange-brown Big Sur cliffs and
      evergreen pine trees on the left, rocky coastline and deep blue ocean on
